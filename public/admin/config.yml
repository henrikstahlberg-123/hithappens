backend:
  name: github
  repo: henrikstahlberg-123/hithappens
  branch: main

media_folder: public/images
public_folder: /images

locale: sv

collections:
  - name: settings
    label: Webbplatsinställningar
    files:
      - name: site
        label: Allmänna inställningar
        file: src/content/settings/site.json
        fields:
          - { label: Webbplatsnamn, name: siteName, widget: string }
          - { label: "Tagline (svenska)", name: taglineSv, widget: string }
          - { label: "Tagline (engelska)", name: taglineEn, widget: string }
          - { label: E-post, name: email, widget: string }
          - { label: Instagram-konto, name: instagramHandle, widget: string }
          - { label: "Rehab-pris (SEK)", name: rehabPriceSek, widget: number }
          - { label: "Fraktkostnad (SEK)", name: shippingCostSek, widget: number }
          - { label: Fraktfritt från antal par, name: freeShippingPairs, widget: number }
          - { label: "Gravyr — pris per par (SEK)", name: engravingPriceSek, widget: number, hint: "Namn och orkester på skaften" }
          - { label: "Moms (%)", name: vatPercent, widget: number }
          - { label: EUR-kurs (multiplicera SEK), name: eurRate, widget: number, value_type: float, step: 0.01 }
          - { label: Hero-bild, name: heroImage, widget: image }
          - { label: "Startsida — rad ovanför rubriken", name: heroEyebrow, widget: string, required: false, hint: "Liten text i versaler ovanför den stora rubriken" }
          - { label: "Startsida — rubrik", name: heroHeading, widget: string, hint: "Stora rubriken på startsidan" }
          - { label: "Startsida — accentord", name: heroAccent, widget: string, hint: "Ordet i rubriken som färgas (måste finnas i rubriken)" }
          - { label: "Startsida — ingress", name: heroLead, widget: text }
          - { label: "Rehab — rubrik", name: rehabHeading, widget: string }
          - { label: "Rehab — accentord", name: rehabAccent, widget: string }
          - { label: "Rehab — ingress", name: rehabLead, widget: text }

  - name: productCategories
    label: Produktkategorier
    label_singular: Produktkategori
    folder: src/content/productCategories
    extension: json
    format: json
    create: true
    slug: "{{order}}-{{key}}"
    identifier_field: nameSv
    summary: "{{order}} · {{nameSv}}"
    fields:
      - { label: Nyckel, name: key, widget: string, hint: "Maskin-id, t.ex. pukstockar, cymbalstockar — ändra inte i efterhand" }
      - { label: "Namn (svenska)", name: nameSv, widget: string }
      - { label: "Namn (engelska)", name: nameEn, widget: string }
      - { label: "Beskrivning (svenska)", name: descSv, widget: text }
      - { label: "Beskrivning (engelska)", name: descEn, widget: text }
      - { label: Färg, name: color, widget: color }
      - { label: Ordning, name: order, widget: number, value_type: int }

  - name: series
    label: Serier
    label_singular: Serie
    folder: src/content/series
    extension: json
    format: json
    create: true
    slug: "{{num}}-{{nameSv | slugify}}"
    identifier_field: nameSv
    summary: "{{category}} · {{num}} · {{nameSv}}"
    fields:
      - { label: Nummer, name: num, widget: string, hint: "Numrering inom kategorin, t.ex. 01, 02" }
      - label: Kategori
        name: category
        widget: relation
        collection: productCategories
        value_field: key
        search_fields: [nameSv, key]
        display_fields: [nameSv]
        hint: "Pukstockar eller Cymbalstockar"
      - { label: "Namn (svenska)", name: nameSv, widget: string }
      - { label: "Namn (engelska)", name: nameEn, widget: string }
      - { label: Färg, name: color, widget: color }
      - { label: "Beskrivning (svenska)", name: descSv, widget: text }
      - { label: "Beskrivning (engelska)", name: descEn, widget: text }
      - { label: Headerbild, name: headerImage, widget: image, required: false }
      - label: Modeller
        name: models
        widget: list
        fields:
          - { label: Namn, name: name, widget: string }
          - { label: Produktkod, name: code, widget: string, required: false }
          - label: Bilder
            name: images
            widget: list
            field: { label: Bild, name: image, widget: image }
          - { label: "Beskrivning (svenska)", name: descSv, widget: text }
          - { label: "Beskrivning (engelska)", name: descEn, widget: text }
          - { label: Längd, name: length, widget: string }
          - { label: Material, name: material, widget: string }
          - { label: Skaftdiameter, name: shaftDiam, widget: string }
          - { label: Huvuddiameter, name: diam, widget: string }
          - label: Hårdhet
            name: hardness
            widget: select
            options:
              - { label: Super soft, value: Super soft }
              - { label: Soft, value: Soft }
              - { label: Medium, value: Medium }
              - { label: Hard, value: Hard }
              - { label: Wood, value: Wood }
          - { label: "Pris (SEK)", name: priceSek, widget: number }
          - label: Status
            name: status
            widget: select
            options:
              - { label: I lager, value: instock }
              - { label: Beställningsvara, value: order }

  - name: otherProducts
    label: "Övrigt · Produkter"
    label_singular: Produkt
    folder: src/content/otherProducts
    extension: json
    format: json
    create: true
    slug: "{{order}}-{{nameSv | slugify}}"
    identifier_field: nameSv
    summary: "{{order}} · {{nameSv}}"
    fields:
      - { label: Ordning, name: order, widget: number, value_type: int }
      - { label: "Namn (svenska)", name: nameSv, widget: string }
      - { label: "Namn (engelska)", name: nameEn, widget: string }
      - { label: "Beskrivning (svenska)", name: descSv, widget: text }
      - { label: "Beskrivning (engelska)", name: descEn, widget: text }
      - label: Bilder
        name: images
        widget: list
        required: false
        hint: "Visas som bildspel. Första bilden visas först."
        field: { label: Bild, name: image, widget: image }
      - { label: "Pris (SEK)", name: priceSek, widget: number, hint: "0 = Pris på förfrågan" }
      - { label: Prisenhet, name: priceUnit, widget: string, required: false, hint: "T.ex. / par. Lämna tomt för styckpris." }
      - label: Val
        name: options
        widget: list
        required: false
        hint: "Varianter med eget pris, t.ex. 5 par och 7 par. Det första valet är förvalt och dess pris visas först."
        summary: "{{fields.label}} — {{fields.priceSek}} SEK"
        fields:
          - { label: Namn, name: label, widget: string }
          - { label: "Pris (SEK)", name: priceSek, widget: number }
      - label: Status
        name: status
        widget: select
        options:
          - { label: I lager, value: instock }
          - { label: Beställningsvara, value: order }

  - name: artists
    label: Artister
    label_singular: Artist
    folder: src/content/artists
    extension: json
    format: json
    create: true
    slug: "{{nameSv | slugify}}"
    identifier_field: nameSv
    fields:
      - { label: Ordning, name: num, widget: string, hint: "T.ex. 01, 02 — styr ordningen på sidan" }
      - { label: Initialer, name: initials, widget: string }
      - { label: "Namn (svenska)", name: nameSv, widget: string }
      - { label: "Namn (engelska)", name: nameEn, widget: string }
      - { label: "Roll (svenska)", name: roleSv, widget: string }
      - { label: "Roll (engelska)", name: roleEn, widget: string }
      - { label: "Citat (svenska)", name: quoteSv, widget: text, required: false, hint: "Lämna tomt så visas inget citat" }
      - { label: "Citat (engelska)", name: quoteEn, widget: text, required: false }
      - { label: "Biografi (svenska)", name: bioSv, widget: text }
      - { label: "Biografi (engelska)", name: bioEn, widget: text }
      - { label: "Favoritmodell (svenska)", name: modelSv, widget: string }
      - { label: "Favoritmodell (engelska)", name: modelEn, widget: string }
      - { label: Foto, name: photo, widget: image, required: false }

  - name: merch
    label: Merch
    label_singular: Merch-produkt
    folder: src/content/merch
    extension: json
    format: json
    create: true
    slug: "{{num}}-{{nameSv | slugify}}"
    identifier_field: nameSv
    fields:
      - { label: Nummer, name: num, widget: string }
      - { label: "Namn (svenska)", name: nameSv, widget: string }
      - { label: "Namn (engelska)", name: nameEn, widget: string }
      - { label: "Beskrivning (svenska)", name: descSv, widget: text }
      - { label: "Beskrivning (engelska)", name: descEn, widget: text }
      - label: Bilder
        name: images
        widget: list
        required: false
        hint: "Visas som bildspel. Första bilden visas först."
        field: { label: Bild, name: image, widget: image }
      - { label: "Pris (SEK)", name: priceSek, widget: number, hint: "0 = Pris på förfrågan" }
      - { label: "Ingår gratis från antal par", name: freeFromPairs, widget: number, required: false, hint: "T.ex. 3 = gratis vid beställning av fler än 3 par. 0 = ingår alltid vid beställning online. Lämna tomt om produkten aldrig ingår gratis." }

  - name: rehabServices
    label: "Rehab · Tjänster"
    label_singular: Tjänst
    folder: src/content/rehabServices
    extension: json
    format: json
    create: true
    slug: "{{order}}-{{nameSv | slugify}}"
    identifier_field: nameSv
    summary: "{{order}} · {{nameSv}} — {{priceSek}} SEK"
    fields:
      - { label: Ordning, name: order, widget: number, value_type: int }
      - { label: "Namn (svenska)", name: nameSv, widget: string }
      - { label: "Namn (engelska)", name: nameEn, widget: string }
      - { label: "Beskrivning (svenska)", name: descSv, widget: text }
      - { label: "Beskrivning (engelska)", name: descEn, widget: text }
      - { label: "Pris (SEK)", name: priceSek, widget: number }
      - label: "Vad ingår (svenska)"
        name: includedSv
        widget: list
        field: { label: Punkt, name: item, widget: string }
      - label: "Vad ingår (engelska)"
        name: includedEn
        widget: list
        field: { label: Item, name: item, widget: string }
      - { label: "Bild — Före", name: imageBefore, widget: image, required: false }
      - { label: "Bild — Rehab", name: imageDuring, widget: image, required: false }
      - { label: "Bild — Efter", name: imageAfter, widget: image, required: false }

  - name: craft
    label: Tillverkningen
    editor: { preview: false }
    files:
      - name: page
        label: Tillverkningen — sidan
        file: src/content/craft/page.json
        fields:
          - { label: Rubrik, name: heading, widget: string }
          - { label: Accentord, name: accent, widget: string, required: false, hint: "Ordet i rubriken som färgas" }
          - { label: Ingress, name: lead, widget: text, required: false }
          - { label: Film, name: videoUrl, widget: string, required: false, hint: "YouTube- eller Vimeo-länk (rekommenderas), eller länk till en .mp4-fil" }
          - { label: Förhandsbild för filmen, name: videoPoster, widget: image, required: false, hint: "Visas innan filmen startar. Liggande 16:9 blir snyggast." }
          - label: Bilder från verkstaden
            name: photos
            widget: list
            required: false
            summary: "{{fields.caption}}"
            hint: "Första bilden visas stort. Dra för att ändra ordning."
            fields:
              - { label: Bild, name: image, widget: image }
              - { label: Bildtext, name: caption, widget: string, required: false, hint: "Valfri, visas när bilden öppnas" }
